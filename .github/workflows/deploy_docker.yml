name: 🐳 Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: jkt48showroom
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Collect public Nuxt variables
        env:
          NUXT_PUBLIC_VARIABLES: ${{ toJSON(vars) }}
        run: |
          set -eu
          printf '%s' "$NUXT_PUBLIC_VARIABLES" > .github-vars.json

          if ! jq -e 'type == "object"' .github-vars.json > /dev/null; then
            echo "GitHub variables context is not valid JSON."
            exit 1
          fi

          jq -r '
            to_entries[]
            | select(.key | test("^NUXT_PUBLIC_[A-Za-z0-9_]+$"))
            | "export \(.key)=\(.value | @sh)"
          ' .github-vars.json > .nuxt-public.env

          # Support the previous variable name while migrating to NUXT_PUBLIC_SITE_URL.
          if ! grep -q '^export NUXT_PUBLIC_SITE_URL=' .nuxt-public.env; then
            jq -r '
              .NUXT_SITE_URL // empty
              | "export NUXT_PUBLIC_SITE_URL=\(. | @sh)"
            ' .github-vars.json >> .nuxt-public.env
          fi

          rm .github-vars.json

          if ! grep -q '^export NUXT_PUBLIC_API=' .nuxt-public.env \
            || ! grep -q '^export NUXT_PUBLIC_SITE_URL=' .nuxt-public.env; then
            echo "Missing required GitHub Actions Variables: NUXT_PUBLIC_API and NUXT_PUBLIC_SITE_URL."
            echo "Available public variable names:"
            sed -n 's/^export \(NUXT_PUBLIC_[A-Za-z0-9_]*\)=.*/\1/p' .nuxt-public.env || true
            echo "If these are Environment Variables, set jobs.build.environment to that environment name."
            exit 1
          fi

      - name: 🏗️ Build and push image
        uses: docker/build-push-action@v6.17.0
        with:
          push: true
          secret-files: |
            nuxt_public_env=.nuxt-public.env
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
    steps:
      - name: 🔑 Setup SSH Key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

      - name: 🚀 Deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key \
            ${{ secrets.CI_USER }}@${{ secrets.CI_HOST }} \
            "cd ${{ vars.DEPLOY_APP_DIR }} && \
            echo '🔄 Pulling latest Docker image...' && \
            docker compose pull ${{ env.IMAGE_NAME }} && \
            echo '♻️ Restarting containers...' && \
            docker compose up -d ${{ env.IMAGE_NAME }}  && \
            echo '✅ Deployment complete!'"
